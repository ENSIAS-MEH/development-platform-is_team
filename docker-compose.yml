version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: mentorpath_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mentorpath_network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: mentorpath_redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - mentorpath_network
  
  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mentorpath_backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - mentorpath_network

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: mentorpath_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - mentorpath_network


volumes:
  postgres_data:

networks:
  # Réseau interne partagé entre tous les containers
  # Grâce à ça, backend peut contacter postgres via "postgres:5432"
  # et redis via "redis:6379" sans exposer ces services à l'extérieur
  mentorpath_network:
    driver: bridge  # bridge = réseau isolé sur la machine locale