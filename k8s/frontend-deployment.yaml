# Frontend Deployment — React app served by Nginx
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mentorpath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: elansarioumaima/mentorpath-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              value: http://backend:8080/api
---
# Service — expose le frontend à l'extérieur
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mentorpath
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30200