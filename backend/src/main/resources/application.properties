# ── Serveur ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Base de données PostgreSQL ────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/mentorpath_db
spring.datasource.username=mentorpath_user
spring.datasource.password=mentorpath_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP (connection pool) ────────────────────────────────────────────────
spring.datasource.hikari.pool-name=MentorPathPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway (migrations SQL) ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=mentorpath_secret_key_must_be_at_least_32_chars_long_2024
app.jwt.expiration=86400000

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
