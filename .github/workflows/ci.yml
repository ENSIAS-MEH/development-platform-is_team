name: MentorPath CI Pipeline

# Se déclenche à chaque push ou pull request sur develop et main
on:

  push:
    # Le pipeline se lance automatiquement quand :
      # Quelqu'un push sur develop
    branches: [develop]
      # Quelqu'un ouvre une Pull Request vers main ou develop
  pull_request:
    branches: [main, develop]
env:
  DOCKERHUB_USERNAME: elansarioumaima



jobs:
  # first job: build and test the backend
  backend-ci:
    name: Build and Test Backend
    # GitHub va créer une VM Linux pour éxécuter notre pipeline
    # donc on 'a pas besoin d'installer qlq chose
    # runs-on: ubuntu-latest => moins stable 
    runs-on: ubuntu-22.04

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache des dépendences Maven (plus rapide)
      # Sauvegarde les dépendances Maven pour ne pas les re-télécharger à chaque fois 
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          # ~ = le dossier home de l'utilisateur sur la VM Linux.
          path: ~/.m2 # means ~/.m2  =  /home/runner/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # 4 Give permission to Maven Wrapper
      - name: Give execute permission to mvnw
        run: chmod +x mvnw
        working-directory: backend
      
      # 5 Compiler et lancer les tests 
      - name: Build and Test
        run: ./mvnw clean verify
        working-directory: backend
      
      #  Vérifier la coverage jaCOCO >=80%
      # Si coverage < 80% → pipeline refuse le merge
      # i comment this step  because already do it by verify
      #- name: Check coverage
        #run: ./mvnw jacoco:check
        #working-directory: backend
      
      # 6. Publier le rapport de coverage sur GitHub (pour le consulter dans l'onglet "Actions" → "Build and Test Backend" → "Artifacts")
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      # 7. Check code Quality Analyzer
      - name: Checkstyle
        run: ./mvnw checkstyle:check
        working-directory: backend
      # 8. Trivy file Syestem
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
      # 9. SonarQube analysis
      #- name: SonarQube Analysis
        #run: |
          #./mvnw sonar:sonar \
          #-Dsonar.projectKey=ENSIAS-MEH_development-platform-is_team \
          #-Dsonar.organization=ensias-meh \
          #-Dsonar.host.url=https://sonarcloud.io \
          #-Dsonar.token=${{ secrets.SONAR_TOKEN }}
        #working-directory: backend
        
      # 10. Build JAR
      - name: Build JAR
        run: ./mvnw clean package -DskipTests
        working-directory: backend
      # 11. Publish JAR as artifact (pour le récupérer dans l'onglet "Actions" → "Build and Test Backend" → "Artifacts")
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      # 12. Build & Tag Docker image
      - name: Build and Tag Docker Image
        run: |
          docker build -f docker/Dockerfile.backend -t mentorpath-backend:latest .
          docker tag mentorpath-backend:latest ${{env.DOCKERHUB_USERNAME}}/mentorpath-backend:latest

      # 13.Docker image scan with Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{env.DOCKERHUB_USERNAME}}/mentorpath-backend:latest'
      # 14. Push Docker image to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{env.DOCKERHUB_USERNAME }} --password-stdin
          docker push ${{env.DOCKERHUB_USERNAME }}/mentorpath-backend:latest

  frontend-ci:
    name: Build and Test Frontend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Cache des dépendences
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Run tests
        run: CI=true npm test
        working-directory: frontend

      # 7. Check code Quality Analyzer
      #- name: Checkstyle
        #run: npm run lint
        #working-directory: frontend

      # 8. Trivy file Syestem
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
      # 9. SonarQube analysis
      #- name: SonarQube Analysis
        #uses: SonarSource/sonarqube-scan-action@master
        #env:
          #SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          #SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        #with:
          #projectBaseDir: frontend

      # Quality gate

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Publish

      # 12. Build & Tag Docker image
      - name: Build and Tag Docker Image
        run: |
          docker build -f docker/Dockerfile.frontend -t mentorpath-frontend:latest .
          docker tag mentorpath-frontend:latest ${{env.DOCKERHUB_USERNAME}}/mentorpath-frontend:latest

      # 13.Docker image scan with Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{env.DOCKERHUB_USERNAME}}/mentorpath-frontend:latest'

      # 14. Push Docker image to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{env.DOCKERHUB_USERNAME }} --password-stdin
          docker push ${{env.DOCKERHUB_USERNAME }}/mentorpath-frontend:latest
  deploy:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to staging
        run: echo "Deploy after both CI jobs pass"
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI Pipeline Notification"
          body: "The CI pipeline has completed successfully."
          to: elansarioumaima93@gmail.com





      

            