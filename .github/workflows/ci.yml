name: MentorPath CI Pipeline

# Se déclenche à chaque push ou pull request sur develop et main
on:
  push:
    # Le pipeline se lance automatiquement quand :
      # Quelqu'un push sur main, develop, ou n'importe quelle branche feature/*
    branches: [develop]
      # Quelqu'un ouvre une Pull Request vers main ou develop
  pull_request:
    branches: [main, develop]
jobs:
  build-and-test:
    name: Build and Test Backend
    # GitHub va créer une VM Linux pour éxécuter notre pipeline
    # donc on 'a pas besoin d'installer qlq chose
    # runs-on: ubuntu-latest => moins stable 
    runs-on: ubuntu-22.04

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Cache des dépendences Maven (plus rapide)
      # Sauvegarde les dépendances Maven pour ne pas les re-télécharger à chaque fois 
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          # ~ = le dossier home de l'utilisateur sur la VM Linux.
          path: ~/.m2 # means ~/.m2  =  /home/runner/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      
      # 4. Compiler et lancer les tests 
      - name: Build and Test
        run: ./mvnw clean verify
        working-directory: backend
      
      # 5. Vérifier la coverage jaCOCO >=80%
      # Si coverage < 80% → pipeline refuse le merge
      - name: Check coverage
        run: ./mvnw jacoco:check
        working-directory: backend
      
      # 6. Publier le rapport de coverage sur GitHub (pour le consulter dans l'onglet "Actions" → "Build and Test Backend" → "Artifacts")
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      

            