name: MentorPath CI Pipeline

# Se déclenche à chaque push ou pull request sur develop et main
on:
  push:
    # Le pipeline se lance automatiquement quand :
    # Quelqu'un push sur develop
    branches:
      [develop]
      # Quelqu'un ouvre une Pull Request vers main ou develop
  pull_request:
    branches: [main, develop]
env:
  DOCKERHUB_USERNAME: elansarioumaima

jobs:
  # ─── Job 1: Backend CI ───────────────────────────────────────────────────────

  backend-ci:
    name: Build and Test Backend
    # GitHub va créer une VM Linux pour éxécuter notre pipeline
    # donc on 'a pas besoin d'installer qlq chose
    # runs-on: ubuntu-latest => moins stable ,it can break
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out the repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 17 (Temurin distribution)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Cache Maven dependencies to speed up builds
      #    The cache key changes whenever pom.xml is modified
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          # ~ = le dossier home de l'utilisateur sur la VM Linux.
          path: ~/.m2 # means ~/.m2  =  /home/runner/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # 4 Give permission to Maven Wrapper
      - name: Give execute permission to mvnw
        run: chmod +x mvnw
        working-directory: backend

      # 5. Compile the project and run all tests
      #    'clean verify' also enforces the JaCoCo coverage threshold (≥80%)
      #    defined in pom.xml — no separate jacoco:check step needed
      - name: Build and Test
        run: ./mvnw clean verify
        working-directory: backend

      #  Vérifier la coverage jaCOCO >=80%
      # Si coverage < 80% → pipeline refuse le merge
      # i comment this step  because already do it by verify
      #- name: Check coverage
      #run: ./mvnw jacoco:check
      #working-directory: backend

      # 6. Publish the JaCoCo HTML report as a GitHub Actions artifact
      #    Viewable under: Actions → Build and Test Backend → Artifacts
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      # 7. Enforce code style rules defined in checkstyle.xml
      #    Fails the pipeline if any style violation is found
      - name: Checkstyle
        run: ./mvnw checkstyle:check
        working-directory: backend

      # 8. Scan the backend source tree for known vulnerabilities (CVEs)
      #    Trivy scans dependencies, configs, and secrets in the filesystem
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
      # 9. SonarQube static analysis (disabled — enable when token is ready)
      # - name: SonarQube Analysis
      #   run: |
      #     ./mvnw sonar:sonar \
      #     -Dsonar.projectKey=ENSIAS-MEH_development-platform-is_team \
      #     -Dsonar.organization=ensias-meh \
      #     -Dsonar.host.url=https://sonarcloud.io \
      #     -Dsonar.token=${{ secrets.SONAR_TOKEN }}
      #   working-directory: backend

      # 10. Package the application as a JAR (tests already ran above)
      - name: Build JAR
        run: ./mvnw clean package -DskipTests
        working-directory: backend

      # 11. Upload the JAR as a GitHub Actions artifact for later use
      #     Viewable under: Actions → Build and Test Backend → Artifacts
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      # 12. Build the Docker image and tag it for Docker Hub
      - name: Build and Tag Docker Image
        run: |
          docker build -f docker/Dockerfile.backend -t mentorpath-backend:latest .
          docker tag mentorpath-backend:latest ${{ env.DOCKERHUB_USERNAME }}/mentorpath-backend:latest

      # 13. Scan the built Docker image for OS/library vulnerabilities with Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "${{ env.DOCKERHUB_USERNAME }}/mentorpath-backend:latest"

      # 14. Authenticate with Docker Hub and push the image
      - name: Push Docker Image to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{env.DOCKERHUB_USERNAME }} --password-stdin
          docker push ${{ env.DOCKERHUB_USERNAME }}/mentorpath-backend:latest

  # ─── Job 2: Frontend CI ──────────────────────────────────────────────────────

  frontend-ci:
    name: Build and Test Frontend
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out the repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js 20 (LTS) for building and testing the React app
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Cache node_modules to avoid re-downloading packages on every run
      #    The cache key changes whenever package-lock.json is modified
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      # 4. Install all npm packages declared in package.json
      - name: Install dependencies
        run: npm install
        working-directory: frontend

      # 5. Run the test suite in CI mode (no interactive watch, exits with code)
      #    CI=true makes Create React App treat warnings as errors
      - name: Run tests
        run: CI=true npm test
        working-directory: frontend

      # 6. Lint check (disabled — enable once ESLint config is finalised)
      # - name: Lint
      #   run: npm run lint
      #   working-directory: frontend

      # 7. Scan the frontend source tree for known vulnerabilities (CVEs)
      #    Trivy scans npm dependencies, configs, and secrets in the filesystem
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./frontend"

      # 8. SonarQube static analysis (disabled — enable when token is ready)
      # - name: SonarQube Analysis
      #   uses: SonarSource/sonarqube-scan-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   with:
      #     projectBaseDir: frontend

      # 9. Compile and bundle the React app for production
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 10. Build the Docker image and tag it for Docker Hub
      - name: Build and Tag Docker Image
        run: |
          docker build -f docker/Dockerfile.frontend -t mentorpath-frontend:latest .
          docker tag mentorpath-frontend:latest ${{ env.DOCKERHUB_USERNAME }}/mentorpath-frontend:latest

      # 11. Scan the built Docker image for OS/library vulnerabilities with Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "${{ env.DOCKERHUB_USERNAME}}/mentorpath-frontend:latest"

      # 12. Authenticate with Docker Hub and push the image
      - name: Push Docker Image to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{env.DOCKERHUB_USERNAME }} --password-stdin
          docker push ${{ env.DOCKERHUB_USERNAME }}/mentorpath-frontend:latest

  # ─── Job 3: Deploy ───────────────────────────────────────────────────────────
  deploy:
    # Only runs after BOTH backend-ci and frontend-ci succeed
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-22.04

    steps:
      # 1. Placeholder deploy step — replace with real deployment logic
      - name: Deploy to staging
        run: echo "Deploy after both CI jobs pass"

      # 2. Send an email notification on pipeline success
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "CI Pipeline Notification"
          body: "The CI pipeline has completed successfully."
          to: elansarioumaima93@gmail.com
