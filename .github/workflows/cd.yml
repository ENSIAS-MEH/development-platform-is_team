name: MentorPath CD Pipeline

on:
    # Déclenchement manuel (pour tester)
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: elansarioumaima

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-22.04
    
 
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET,DOCKERHUB_PASSWORD
          script: |
            set -e

            APP_DIR="/home/ubuntu/mentorpath/development-platform-is_team"

            # ── 1. Clone or pull the repo ──────────────────────────────────
             if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR" && git pull
            else
              mkdir -p /home/ubuntu/mentorpath
              git clone -b develop https://github.com/ENSIAS-MEH/development-platform-is_team.git "$APP_DIR"
            fi

            cd "$APP_DIR"  
            # ── 2. Write .env ──────────────────────────────────────────────
            printf 'POSTGRES_DB=%s\n'       "$POSTGRES_DB"       > .env
            printf 'POSTGRES_USER=%s\n'     "$POSTGRES_USER"     >> .env
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> .env
            printf 'JWT_SECRET=%s\n'        "$JWT_SECRET"        >> .env
            printf 'POSTGRES_PORT=5432\n'                        >> .env
            printf 'REDIS_PORT=6379\n'                           >> .env
            printf 'BACKEND_PORT=8080\n'                         >> .env
            printf 'FRONTEND_PORT=4200\n'                        >> .env

            # ── 3. Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ env.DOCKERHUB_USERNAME }} --password-stdin

            # ── 4. Pull latest images ──────────────────────────────────────
            docker pull ${{ env.DOCKERHUB_USERNAME }}/mentorpath-backend:latest
            docker pull ${{ env.DOCKERHUB_USERNAME }}/mentorpath-frontend:latest

            # ── 5. Deploy ──────────────────────────────────────────────────
            docker compose up -d --remove-orphans

            # ── 6. Status ──────────────────────────────────────────────────
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
  notify:
    name: Send Email Notification
    needs: deploy
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
      - name: Send email on success
        if: needs.deploy.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "✅ MentorPath CD Pipeline - SUCCESS"
          body: |
            Le déploiement CD a réussi!
            
            📅 Date: ${{ github.event.head_commit.timestamp }}
            🔧 Version: ${{ github.run_number }}
            🌐 Frontend: http://${{ secrets.AWS_EC2_HOST }}:4200
            🔗 Backend API: http://${{ secrets.AWS_EC2_HOST }}:8080
            📚 Swagger UI: http://${{ secrets.AWS_EC2_HOST }}:8080/swagger-ui.html
            
            🚀 Application déployée avec succès sur AWS EC2!
          to: elansarioumaima93@gmail.com
      
      - name: Send email on failure
        if: needs.deploy.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "❌ MentorPath CD Pipeline - FAILED"
          body: |
            Le déploiement CD a échoué!
            
            📅 Date: ${{ github.event.head_commit.timestamp }}
            🔧 Version: ${{ github.run_number }}
            ❌ Vérifiez les logs dans GitHub Actions.
            
            🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: elansarioumaima93@gmail.com