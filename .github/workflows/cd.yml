name: MentorPath CD Pipeline

on:
    # Déclenchement manuel (pour tester)
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: elansarioumaima

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-22.04
    
 
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/mentorpath || mkdir -p /home/ubuntu/mentorpath
            cd /home/ubuntu/mentorpath

            # Cloner le repository pour récupérer docker-compose.yml
            if [ -d "development-platform-is_team" ]; then
                cd development-platform-is_team && git pull
            else
                git clone https://github.com/ENSIAS-MEH/development-platform-is_team.git
                cd development-platform-is_team
            fi
            
            # Create .env from secrets
            cat > .env << 'EOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ env.DOCKERHUB_USERNAME }} --password-stdin
            
            # Pull and deploy
            docker compose pull
            docker compose up -d
            
            # Show status
            docker ps
  notify:
    name: Send Email Notification
    needs: deploy
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
      - name: Send email on success
        if: needs.deploy.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "✅ MentorPath CD Pipeline - SUCCESS"
          body: |
            Le déploiement CD a réussi!
            
            📅 Date: ${{ github.event.head_commit.timestamp }}
            🔧 Version: ${{ github.run_number }}
            🌐 Frontend: http://${{ secrets.AWS_EC2_HOST }}:4200
            🔗 Backend API: http://${{ secrets.AWS_EC2_HOST }}:8080
            📚 Swagger UI: http://${{ secrets.AWS_EC2_HOST }}:8080/swagger-ui.html
            
            🚀 Application déployée avec succès sur AWS EC2!
          to: elansarioumaima93@gmail.com
      
      - name: Send email on failure
        if: needs.deploy.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "❌ MentorPath CD Pipeline - FAILED"
          body: |
            Le déploiement CD a échoué!
            
            📅 Date: ${{ github.event.head_commit.timestamp }}
            🔧 Version: ${{ github.run_number }}
            ❌ Vérifiez les logs dans GitHub Actions.
            
            🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: elansarioumaima93@gmail.com